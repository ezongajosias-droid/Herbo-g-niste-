const MT=[
[7744,()=>{const a=ri(12,99),b=ri(12,99);return[`${a} + ${b} = ?`,String(a+b)]}],
[79200,()=>{const a=ri(100,999),b=ri(12,99);return[`${a} − ${b} = ?`,String(a-b)]}],

function draw(r){const g=G[r],pool=B[r]||[];

 return pick(pool.length?pool:[["Question de secours : 1 + 1 = ?","2"]])}

function home(){clearInterval(S.tm);

 <button class="btn" data-go="all">Défi mixte · 10 questions</button>
 <h2>Choisis une rubrique</h2>
 <ul class="toc">${R.map(([id,n,e])=>`<li><button data-go="${id}"><i>${e}</i><b>${n}</b><u>${fmt(cnt(id))}</u></button></li>`).join("")}</ul>
 <p class="hint">${fmt(total())} questions au total, dont ${fmt(auto())} générées automatiquement (calculs, capitales, éléments chimiques, provinces). Ajoute les tiennes ci-dessous.</p>
 <button class="btn s o" data-imp>＋ Ajouter mes questions</button><button class="btn s o" id="inst" hidden>📲 Installer l’app</button>

 syncInstall()}

function start(r){S={r,i:0,ok:0,seen:new Set()};next()}
function next(){clearInterval(S.tm);if(S.i>=10)return end();
 S.rid=S.r=="all"?pick(R)[0]:S.r;S.q=draw(S.rid);S.i++;S.left=20;
 app.innerHTML=`<div class="top"><button class="link" data-home>← Quitter</button><span>${RN[S.rid]} · ${S.i}/10</span></div>
 <div class="bar"><i id="bar"></i></div>
 <div class="board"><p class="q">${esc(S.q[0])}</p><div id="ans"></div></div><div id="act"><button class="btn" data-rev>Révéler la réponse</button></div>`;
 S.tm=setInterval(()=>{S.left-=.1;const b=$("#bar");if(b)b.style.width=Math.max(0,S.left/20*100)+"%";if(S.left<=0)reveal()},100)}
function reveal(){clearInterval(S.tm);if(!$("#ans")||$("#ans").innerHTML)return;
 $("#ans").innerHTML=`<p class="a">${esc(S.q[1])}</p>`;
 $("#act").innerHTML=`<p class="hint">Avais-tu la bonne réponse ?</p><div class="row"><button class="btn ko" data-g="0">✘ À revoir</button><button class="btn ok" data-g="1">✔ Je savais</button></div>`}
function grade(g){st.n++;if(+g){S.ok++;st.ok++;streak++;st.best=Math.max(st.best,streak)}else streak=0;LS.s("ht_s",st);next()}
function end(){const s=S.ok,t=["Apprenti curieux","Apprenti curieux","Apprenti curieux","Apprenti curieux","Esprit vif","Esprit vif","Esprit vif","Savant","Savant","Maître herbogéniste","Génie absolu"][s];
 app.innerHTML=`<div class="top"><span></span><span>Séance terminée</span></div><div class="board" style="text-align:center"><p class="big">${s}/10</p><h2 style="margin-top:14px">${t}</h2></div>
 <button class="btn" data-go="${S.r}">Rejouer cette séance</button><button class="btn o" data-home>Retour au sommaire</button>
 <footer>Herbogéniste Training · par <b>Josias Ezonga</b> (NINJAXI)</footer>`}
function imp(){app.innerHTML=`<div class="top"><button class="link" data-home>← Retour</button><span>Mes questions</span></div>
 <p class="hint">Une question par ligne, au format <b>rubrique | question | réponse</b>. Rubriques : ${R.map(r=>r[0]).join(", ")}. Colle autant de lignes que tu veux : elles sont gardées sur cet appareil.</p>
 <textarea id="ta" placeholder="sci | Quelle est la formule du sel de table ? | NaCl"></textarea><button class="btn" data-save>Enregistrer ces questions</button><p class="hint" id="msg">${custom.length} question(s) personnelle(s) enregistrée(s).</p>`}
function save(){let n=0;$("#ta").value.split("\n").forEach(l=>{const[r,q,a]=l.split("|").map(s=>s.trim());if(RN[r]&&q&&a){custom.push([r,q,a]);(B[r]??=[]).push([q,a]);n++}});
 LS.s("ht_c",custom);$("#msg").textContent=n+" question(s) ajoutée(s). Total personnel : "+custom.length+".";$("#ta").value=""}

app.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;const d=t.dataset;
 if("go"in d)start(d.go);else if("home"in d)home();else if("rev"in d)reveal();else if("g"in d)grade(d.g);
 else if("imp"in d)imp();else if("save"in d)save();else if(t.id=="inst"&&dp){dp.prompt();dp=null;t.hidden=true}});
addEventListener("keydown",e=>{if(e.code=="Space"&&$("[data-rev]")){e.preventDefault();reveal()}});

/* ===== Installation + hors ligne ===== */
function syncInstall(){const i=$("#inst");if(!i||stand)return;if(dp)i.hidden=false;
 if(/iphone|ipad|ipod/i.test(navigator.userAgent)&&$("#ios"))$("#ios").hidden=false}
addEventListener("beforeinstallprompt",e=>{e.preventDefault();dp=e;syncInstall()});
addEventListener("appinstalled",()=>{dp=null;home()});
function net(){const n=$("#net");n.textContent=(navigator.onLine?"● en ligne":"● hors ligne")+(swReady?" · prêt hors ligne ✓":"");n.className="pill"+(swReady?" on":"")}
addEventListener("online",net);addEventListener("offline",net);
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").then(()=>navigator.serviceWorker.ready).then(()=>{swReady=true;net()}).catch(()=>{}));
net();home();
